# ─── nginx.conf ──────────────────────────────────────────────────────────────
# Terminates TLS and reverse-proxies HTTPS → Fastify on port 3001.
# Mount your cert files via docker-compose volumes (see docker-compose.yml).

events { worker_connections 1024; }

http {

  # ── Redirect all plain HTTP to HTTPS ────────────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS server ─────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS only — drops SSLv3, TLS 1.0, TLS 1.1
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;

    # Proxy all traffic to Fastify
    location / {
      proxy_pass         http://server:3001;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      # WebSocket support (for future use)
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";

      # Timeouts
      proxy_connect_timeout 10s;
      proxy_read_timeout    60s;
    }
  }
}